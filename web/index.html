    <!-- Loading screen before any script runs (React's own <Splash> takes over, same look). -->
    <div id="root">
      <div id="boot">
        <svg viewBox="0 0 48 24" aria-hidden="true"><path d="M2 14 C7 14 8 5 13 5 S20 19 26 19 S33 8 38 8 S44 13 46 13" pathLength="100" /></svg>
        <div class="name">lemody</div>
        <div class="bar"><i></i></div>

      </div>
    </div>
    <noscript>
      <h1>Lemody: free online karaoke with lyrics and live pitch</h1>
      <p>Sing along to Hindi, Punjabi and English songs, see your pitch on the original melody and get a score. Lemody needs JavaScript and a microphone.</p>
      <p><a href="/songs">Songs</a> · <a href="/guides">Singing guides</a> · <a href="/karaoke-online">Karaoke online</a> · <a href="/pitch-checker">Pitch checker</a> · <a href="/about">About</a> · <a href="/privacy">Privacy</a> · <a href="/contact">Contact</a></p>
    </noscript>
    <style>
      #boot { --bg: #111111; --main: #f0f0f0; --text: #eeeeee; --sub: #7a7a7a; --track: #1a1a1a;
        position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: 'Geist Sans', ui-sans-serif, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
      #boot svg { width: 96px; height: 48px; overflow: visible; }
      #boot path { fill: none; stroke: var(--main); stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 100 200; stroke-dashoffset: 104;
        animation: boot-draw 2.8s cubic-bezier(.45,0,.55,1) infinite alternate; }
      #boot .name { margin-top: 20px; color: var(--text); font-size: 28px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
      #boot .bar { margin-top: 24px; width: 112px; height: 2px; border-radius: 2px; background: var(--track); overflow: hidden; }
      #boot .bar i { display: block; width: 33%; height: 100%; border-radius: 2px; background: var(--main); animation: boot-slide 1.1s cubic-bezier(.45,0,.55,1) infinite; }
      #boot .by { position: fixed; bottom: max(20px, env(safe-area-inset-bottom)); color: var(--sub); font-size: 11px; }
      #boot .by b { color: var(--text); opacity: .8; font-weight: 600; letter-spacing: .025em; }
      @keyframes boot-draw { 0%, 8% { stroke-dashoffset: 104 } 88%, 100% { stroke-dashoffset: 0 } }
      @keyframes boot-slide { from { transform: translateX(-100%) } to { transform: translateX(300%) } }
    </style>
    <script>
      // match the saved theme's colours, so the loading screen doesn't flash a different background
      try {
        var s = JSON.parse(localStorage.getItem('lemo.settings') || '{}') || {}
        var t = s.themePicked ? s.theme : 'mono'
        var c = { studio: ['#131313', '#d8b36f', '#ededea', '#7d7d82', '#1c1c1d'], ink: ['#0d1117', '#8fb4f6', '#e6edf3', '#6f7c8d', '#161c25'], sage: ['#111412', '#a3c9a8', '#e7ece8', '#76837b', '#191e1b'],
          velvet: ['#151114', '#e3a7b6', '#f0e9ee', '#857784', '#1f181d'], mono: ['#111111', '#f0f0f0', '#eeeeee', '#7a7a7a', '#1a1a1a'] }[t]
        if (c) {
          var b = document.getElementById('boot').style
          ;['--bg', '--main', '--text', '--sub', '--track'].forEach(function (k, i) { b.setProperty(k, c[i]) })
          document.querySelector('meta[name=theme-color]').setAttribute('content', c[0])
        }
      } catch (e) {}
    </script>
